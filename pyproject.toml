[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not sweep and not slow and not bench'"
markers = [
    "gui: needs a (headless) Qt main window",
    "bench: writes timing tables, not pass/fail",
    "slow: real-data regressions that take minutes",
    "sweep: clicks every button in several application states",
]
