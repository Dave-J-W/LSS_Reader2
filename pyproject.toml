[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not sweep and not slow and not bench'"
# a passing test's tmp_path is removed as soon as it ends; only failing tests'
# folders are kept, and only from the latest run (2026-11-23: a quick run left
# 1.2 GB, and pytest kept the last three runs)
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
markers = [
    "gui: needs a (headless) Qt main window",
    "bench: writes timing tables, not pass/fail",
    "slow: real-data regressions that take minutes",
    "sweep: clicks every button in several application states",
]
