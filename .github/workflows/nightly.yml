# The heavy suites, run by GitHub on main every night (AGENTS.md rule 14, owner 2026-11-27):
# the slow suite (real-data regressions on the committed public data; the private sets are
# absent here, so their tests skip) and the crash sweep. A failure opens an issue labelled
# `task`, `bug`, `nightly`, or comments on the one already open, so a repeated failure is one
# issue. Started by hand (Actions -> nightly -> Run workflow) it can also run
# `pytest -m release`, the check that generated files are current, which belongs before a
# release: between releases those files lag by design (rule 11), so it isn't scheduled.
name: nightly

on:
  schedule:
    - cron: '0 8 * * *'          # 08:00 UTC, 02:00 in Chicago
  workflow_dispatch:
    inputs:
      release:
        description: 'Also run pytest -m release (before a release)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        mark: [slow, sweep]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Qt's system libraries (offscreen)
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: pytest -m ${{ matrix.mark }}
        run: python -m pytest -q -p no:cacheprovider -rfE --tb=short -m ${{ matrix.mark }}

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
      - run: pip install -r requirements-dev.txt
      - name: pytest -m release
        run: python -m pytest -q -p no:cacheprovider -rfE --tb=short -m release

  report:
    needs: suite
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the nightly-failure issue
        run: |
          body="The nightly slow/sweep run failed on main at ${GITHUB_SHA::7}: $RUN_URL (the failing job's log names the tests). AGENTS.md rule 15: claim it, fix it, close it with the commit."
          n=$(gh issue list --label nightly --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Still failing. $body"
          else
            gh issue create --title "Nightly slow/sweep run failing on main" --label task --label bug --label nightly --body "$body"
          fi
