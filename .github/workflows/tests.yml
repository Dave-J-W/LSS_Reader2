# The quick suite, run by GitHub on every pull request into main and every push to main
# (AGENTS.md rule 14, owner 2026-11-27). This run is the check of record: sessions run only
# the tests for what they changed, and a reviewer reads this run's result instead of rerunning.
# A newer push to the same branch cancels the older run. `pull_request` (never
# `pull_request_target`) and read-only permissions: code under test never sees a secret.
name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Qt's system libraries (offscreen)
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Quick suite
        run: python -m pytest -q -p no:cacheprovider -rfE --tb=short
