  # ------------------------------------------------------------------ GID
  - id: gid
    name: Grazing-incidence diffraction map (pinhole default, or legacy patch)
    priority: 3
    experiment: >
      `ascan dth a b n t` scans of the detector angle at a fixed incidence
      angle below the critical angle, one scan per Qz level (low, middle,
      high), one Pilatus frame per point; the pinhole (S4) in front of the
      detector defines 2theta per column (NX school: scans 11 and 12, 41
      and 4 frames, the second aborted; the owner's private pairs have
      complete levels). One absorber setting per GID scan (worksheet: the
      absorber factor is not applied; joins absorb differences). The reader
      bins each column at its own 2theta (exact IMG_COO_CONV geometry,
      default since 2026-11-18), joins levels and scans, and saves the
      map and its Qxy/Qz projections.
    recognised_by: >
      series kind 'gid': consecutive `ascan dth` scans with Pilatus frames
      (`series.infer`), or `#U Series kind=gid level=k`. Det_Th > 1 deg;
      `#B1` gives the S4-detector distance (pinhole).
    known_from: ["owner 2026-11-18 (D36, D40, F45, F61, F62)", "owner 2026-11-19 (D51)", "code", "tests/test_gid_worksheet.py", "tests/test_real_nx_school.py", "docs/manual/gid_patching.md", "run 2026-11-22"]
    steps:
      - id: gid.open
        uses: shared.open
      - id: gid.series
        uses: shared.series
        do: "Choose the GID series ('gid 2/? (partial): S# 11-12')"
        known_from: run 2026-11-22
      - id: gid.frames
        uses: shared.frames
        do: Select all frames of the levels
      - id: gid.look
        uses: shared.frames-look
        do: Look at single frames (optional); the Pinhole box gives display and cuts the pinhole geometry
        controls: [pilAxesComboBox, pilLogIntCheckBox, pilMinLineEdit, pilMaxLineEdit, pilCMapComboBox, pilPinholeCheckBox, pilMoviePushButton]
        known_from: code; owner 2026-11-18 (D40)
        issues:
          - "Two pinhole switches: the Pilatus tab's 'Pinhole' (display and cuts) and the worksheet's 'Pinhole: angle per column' (the patch)"
      - id: gid.background
        do: Optionally subtract background frames (add selected frames to the background list, factor, ignore negatives)
        where: left panel (background list)
        controls: [backgroundPushButton, backgroundListWidget, bgFacLineEdit, bgIgnoreNegCheckBox, bgSelectAllCheckBox, removePushButton]
        user_decides: which frames are background, the factor
        automatic: no
        could_be_automatic: ""
        known_from: code; guess (whether it is used for GID)
        issues:
          - "Background-subtracted maps are not scriptable (gidScript says so)"
      - id: gid.settings
        do: Open the worksheet (GID menu > Worksheet) and check the settings - pinhole on, response, footprint window, S4-detector distance (Fit), rows, columns
        where: Pilatus tab > GID menu > Worksheet (separate window)
        controls: [gidComboBox, gidPinholeCheckBox, gidPinholeDistSpinBox, gidFitDistancePushButton, gidResponseComboBox, gidFootprintComboBox, gidTransverseComboBox, gidRowMinSpinBox, gidRowMaxSpinBox, gidColumnsSpinBox, pilHSlitLineEdit, gidAreaCheckBox, gidPolCheckBox, gidApplyJoinsCheckBox, gidMinFramesSpinBox, gidArmCheckBox, gidDefaultsPushButton]
        user_decides: usually the defaults (pinhole, exact footprint, response fit); the distance from Fit when reliable
        automatic: partly
        could_be_automatic: calibrate the distance automatically on the first patch and say so (P43 built as a button)
        known_from: owner 2026-11-18/19 (D40, D51); test tests/test_gid_worksheet.py; docs docs/manual/gid_patching.md
        issues:
          - "Actions are items of a combo box whose first item 'GID' is a title; choosing the same item again needs a re-selection (code, activated)"
          - "'Columns per frame' (worksheet) and the H slit field on the Pilatus tab are one setting in two places"
      - id: gid.patch
        do: GID Patch (or GID Patch Relax for the larger Q grid) - the map is drawn on the Pilatus tab in Q
        where: Pilatus tab > GID menu
        controls: [gidComboBox, gidPatchPushButton]
        user_decides: Patch or Patch Relax
