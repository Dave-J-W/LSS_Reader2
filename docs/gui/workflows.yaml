      all seven elements summed (owner, 2026-11-19, D49; macros read).
      Optional deliberate dose with `eb_expose time abs`. The bu September
      file has 24 escan scans. What the reader should output for EXAFS is
      not scoped (F36).
    recognised_by: >
      series kind 'energy': consecutive `escan` scans (`series.infer`), or
      `#U Series kind=energy`. Spectra per point in `vortex/`; whether these
      scans carry a `#V` line (needed for the window to list the spectra)
