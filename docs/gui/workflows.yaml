    outputs: ["<name>_qxy_gid.txt, <name>_qz_gid.txt, <name>_q2d_gid.txt (PROJECT_CONTEXT)", "workbook: Saved (GID map), Maps", "Script pane: exp.gid(...)"]
    scripted_as: "Experiment.gid([11, 12], params=GIDParams(...), axes='Q').save(name)"
    questions: [Q-GID-1, Q-GID-2, Q-GID-3, Q-GID-4, Q-GID-5]

  # ------------------------------------------------------------------ XFNTR
  - id: xfntr
    name: X-ray fluorescence near total reflection
    priority: 4
    experiment: >
      The usual XFNTR scan is the macro `fluo_p time abs`: S1 set, the
      detector arm moved out of the way, then `MCAscanpt lscan 0.015 0.03
      15 time`, an hklscan in Qz across the critical angle with one MCA
      spectrum per point (single-element Dante, or the 7-element Xspress3
      of which XFNTR uses the central element 1). Repeats of one scan are
      merged on target Qz (owner's rule F65). The spectra are dominated by
      the elastic line; the element lines are weaker; what counts is the
      fitted line normalised by Monc, not the SPEC Vortex counter (owner
      D47). No absorber setting is written by `getandsave_mca` scans (the
      last #A above is taken, D24).
    recognised_by: >
      series kind 'xfntr': consecutive L scans with a `#V` line (detector
      Vortex), alignment scans attached (`series.infer`); or `#U Series
      kind=xfntr`. MCA files in `vortex/`, per-point (`mca_save_point`).
    known_from: ["owner 2026-11-19 (F65, D45, D47, D49, fluo.mac received)", "code", "tests/test_xfntr.py", "tests/test_mca_merge.py", "docs/SCRIPTING.md"]
    steps:
      - id: xfntr.open
        uses: shared.open
      - id: xfntr.detector
        do: For the 7-element detector choose the central element (Centre = element 1)
        where: File > Preferences > Fluorescence detector
        controls: [actionPreferences, prefMcaCentrePushButton, prefMcaAllPushButton, prefMcaChannel1CheckBox]
        user_decides: element(s); default all
        automatic: no
        could_be_automatic: centre element by default for xfntr series, all for energy series (D49)
        known_from: owner 2026-11-19 (D49, "the central element is 1"); code
        issues:
          - "The default (all elements) suits EXAFS, not XFNTR; switching kinds means visiting Preferences each time"
      - id: xfntr.series
        uses: shared.series
        do: Choose the XFNTR series - the repeats of one run, which the user decides to merge
        user_decides: which repeats (one run, wavelength, sample, signal shape - the user's choice, owner 2026-11-19)
        known_from: owner 2026-11-19 (F65 steps 1, 7 left to the user); code
        issues:
          - "Repeats whose line amplitude changes from repeat to repeat are merged without warning (physics_notes 2026-11-19, private data)"
      - id: xfntr.spectra
        uses: shared.frames
        do: Select all spectra; the MCA tab overlays them, normalised by Monc x real/live time x absfac^n
        controls: [imageListWidget, imageSelectAllCheckBox, mcaNormComboBox, mcaGainCheckBox, mcaPhotonCheckBox, mcaLogYCheckBox, mcaOffsetCheckBox, mcaOffsetLineEdit]
        known_from: code; test tests/test_xfntr.py
        issues:
          - "Dozens of spectra are overlaid in one plot; Offset Factor is the only separation"
      - id: xfntr.calib
        do: Check the energy calibration (from the file, or typed)
        where: MCA tab
        controls: [mcaCalibCheckBox, mcaCalibConLineEdit, mcaCalibLinLineEdit, mcaCalibQuaLineEdit]
        user_decides: file calibration (usual) or typed
        automatic: yes
        could_be_automatic: ""
        known_from: code
        issues: []
      - id: xfntr.window
        do: Choose the line window (range field; Enter draws it on the spectra)
        where: MCA tab
        controls: [mcaRanLineEdit]
        user_decides: the window around the element line (default 1:1000, the whole spectrum)
        automatic: no
        could_be_automatic: line markers and a proposed window from the element (F47, xraydb); remember the window per sample
        known_from: code; guess (how users place it)
        issues:
          - "The default window is the whole spectrum, dominated by the elastic line"
      - id: xfntr.measure
        do: Sum All (window sum) or Fit lines (Gaussian on a background; the sum fixes position and width)
        where: MCA tab
        controls: [mcaSumAllPushButton, mcaFitLinesPushButton, mcaFitOptionsPushButton, mcaFitPushButton, mcaFitAllPushButton, mcaAcceptPushButton]
        user_decides: window sum or fitted lines (owner D47 - fitted lines are what count); fit options (background order)
        automatic: no
        could_be_automatic: Fit lines as the default for xfntr (D47)
        known_from: owner 2026-11-19 (D47, F22a 6); code; test tests/test_xfntr.py, tests/test_gui_workbook.py (Fit lines)
        issues:
          - "Three fitting paths side by side: Fit / Fit All / Accept (legacy dialog), Fit lines (new) and Sum All"
      - id: xfntr.axis
        do: Put the intensities on the Qz axis
        where: MCA tab
        controls: [mcaXAxisComboBox, mcaDataListWidget]
        user_decides: Qz (Frame is the default)
        automatic: no
        could_be_automatic: Qz by default for xfntr series, Energy for energy series
        known_from: code; test tests/test_xfntr.py (export against Qz)
        issues:
          - "The x axis also decides the exported column and the merge axis; the default is Frame"
      - id: xfntr.merge
        do: Merge repeated points (default window 0.1 x the Qz grid step; Qz jitter added to the errors); delete bad points
        where: MCA tab > Merge (dialog); Delete
        controls: [mcaMergePushButton, mcamerge.resLineEdit, mcamerge.okPushButton, mcaDelPushButton]
        user_decides: accept the default window or type one; which points to delete
        automatic: partly
        could_be_automatic: merge on Sum All when the selection holds repeats (the edge check, F65 steps 3-4, is backlog)
        known_from: owner 2026-11-19 (F65 steps 2, 5); test tests/test_mca_merge.py
        decision: "Repeats to merge?"
        goto: {"no": xfntr.export}
        issues:
          - "Deleted points are gone (no mask, no undo; F16)"
      - id: xfntr.export
        do: Export Integral - <name>_flu.txt (x, I, sigma); the Script pane records exp.fluorescence(...)
        where: MCA tab > Export Integral
        controls: [mcaExportIntPushButton]
        user_decides: file name
        automatic: no
        could_be_automatic: ""
        known_from: code (mcaSaveIntData); test tests/test_xfntr.py
        issues:
          - "Written with full float precision, unlike the reflectivity files (physics_notes 2026-11-15)"
      - id: xfntr.save
        uses: shared.workbook
        controls: [mcaSaveWorkbookPushButton]
        known_from: test tests/test_gui_workbook.py (MCA sum and Fit lines saved)
      - id: xfntr.live
        uses: shared.live
        do: With Live on, spectra appended to the latest MCA file are picked up and the MCA integrals remade
        known_from: test tests/test_gui_live.py (spectra appended are picked up); docs TODO (the MCA redraw on a fluorescence series is untested)
      - id: xfntr.downstream
        do: Fit the fluorescence curve downstream
        where: outside the reader
        controls: []
        user_decides: ""
        automatic: no
        could_be_automatic: ""
        known_from: guess (xmodfit or another program; Q-XFNTR-5)
        issues: []
    outputs: ["<name>_flu.txt", "workbook: Saved (fluorescence sum / line fit / merge)", "Script pane: exp.fluorescence(...)"]
    scripted_as: "flu = Experiment.fluorescence(scans, window=(lo, hi), channels=[1]); flu.merge(); flu.save(name, x='qz')"
    questions: [Q-XFNTR-1, Q-XFNTR-2, Q-XFNTR-3, Q-XFNTR-4, Q-XFNTR-5]

  # ------------------------------------------------------------------ EXAFS
  - id: exafs
