# The workflow map (F67; owner, 2026-11-22: "a key deliverable").
#
# Source of docs/gui/workflows.md (rendered by `python tests/tools/gui_map.py`).
# Schema: docs/gui/README.md. Two optional additions used here, both
# understood by the tool:
#   - `uses: <shared step id>` in a step: the step repeats a shared step
#     (top-level `shared_steps:`); fields given in the step override the
#     shared one's.
#   - `decision: "<question>"` and `goto: {<answer>: <step id>, ...}` in a
#     step: a decision point; the flowchart draws a diamond after the step
#     with one edge per answer (the next step in the list is the default).
#
# known_from values: "owner <date>" (the owner's words, cited in
# FEATURE_REQUESTS / physics_notes), "code" (read in mainwindow.py or
# lss_core), "test <file>" (a test drives it), "run 2026-11-22" (opened the
# public NX school file offscreen while writing this map), "docs <file>",
# "guess" (an inference not checked against the owner or the code).
# Owner statements and inferences are kept apart (AGENTS.md rules 5-6).
#
# Control ids: objectName in mainwindow.ui, the objectName / attribute of
# code-built widgets, QAction objectNames; widgets of dialogs loaded from a
# .ui file as <ui file stem>.<objectName> (e.g. refpatch.nextPushButton,
# pdburn.refPushButton). Code-built widgets (the burn dialog's Trends tab,
# the GID worksheet, Preferences, the fit dialogs) use their own unique
# objectNames (e.g. burnAnalysePushButton), as the inventory does.

shared_steps:
  - id: shared.open
    do: Open the SPEC file (File > Open Spec File); the scans, the series and the detector folders are read
    where: File menu
    controls: [actionOpen_Spec_File]
    user_decides: which SPEC file
    automatic: partly
    could_be_automatic: reopen the last file and its workbook settings (F66 to-do); offer the series' reductions at once (F60)
    known_from: code; run 2026-11-22
    issues:
      - "Opening a file with Pilatus images presets the reflectivity ROI (21,11), the background offset (0.5), Qc (0.0217) and the absorber factor (code, openSpecFile ~l.744); nothing on screen says so"
      - "A missing detector folder opens a directory chooser (F27)"
  - id: shared.series
    do: Choose the series (Series list above the scan list) or click one of its scans; the whole series is selected by default
    where: left panel
    controls: [seriesComboBox, seriesWholeCheckBox, scanListWidget, scansLineEdit]
    user_decides: which series (or scans by number); Whole series on (default) or off
    automatic: partly
    could_be_automatic: select the newest series of the kind the user works on; in live mode follow it (built for whole-series selections, L3)
    known_from: owner 2026-11-21 (D55); test tests/test_gui_series.py; run 2026-11-22
    issues:
      - "The Series list is a combo box with a placeholder first item ('Series: choose to select its scans'); the list of series is not visible at a glance (run 2026-11-22)"
      - "Guessed series have n unknown ('4/?'); the kind is only a guess until the macros write #U Series (handoff_out/05)"
      - "Selecting a scan always switches to the SpecPlot tab (code, scanListChanged), whatever the workflow"
  - id: shared.frames
    do: Select the frames (Pilatus) or spectra (MCA) of the selected scans; Select All for all of them
    where: left panel (image list, labelled 'Pilatus:' or 'Vortex:')
    controls: [imageListWidget, imageSelectAllCheckBox]
    user_decides: all frames (usual) or a subset (left out of the reduction, kept in remakes)
    automatic: no
    could_be_automatic: select all frames of a whole-series selection by default; show a movie instead of tiles (F69)
    known_from: code; test tests/test_gui_workflows.py
    issues:
      - "Selecting all frames draws every frame as a tile on the Pilatus tab (owner 2026-11-22: more than 6 tiles is too many, F69)"
      - "Selecting frames switches to the Pilatus tab (2) or the MCA tab (5) (code)"
  - id: shared.absorber
    do: Check the absorber factor per unit (from the energy by default, calibrated foils at 9.70-10.30 keV)
    where: left panel; File > Preferences > Absorber foils
    controls: [AbsFacLineEdit, absFacEnergyCheckBox, actionPreferences, prefCalibratedCheckBox]
    user_decides: keep 'from E' (default on, D34) or type a factor
    automatic: yes
    could_be_automatic: ""
    known_from: owner 2026-11-17/18 (D23, D25, D34, F56); code
    issues:
      - "The field shows 'cal' when calibrated foils are used; what is used where (Ref Patch measures the scale, D21) is only in tooltips"
  - id: shared.errors
    do: Choose the error model (Legacy default, or Budget with a monitor model)
    where: Errors pane (dock)
    controls: [errorModeComboBox, monitorKindComboBox, errorModel_sigma]
    user_decides: Legacy (default, byte-identical files) or Budget
    automatic: yes
    could_be_automatic: ""
    known_from: owner 2026-11-17 (D20, D22, D26); code
    issues:
      - "A global setting in a dock, far from the reductions it changes; which default the export should use is open (TODO B)"
  - id: shared.workbook
    do: The finished reduction is saved into <SPEC file>_reader.xlsx automatically; Save stores a version with a note
    where: Save button beside each Export; GID menu 'Save to workbook'
    controls: [prefAutoSaveCheckBox, prefSaveNoteCheckBox]
    user_decides: whether to add a 'user' version with a note
    automatic: yes
    could_be_automatic: ""
    known_from: owner 2026-11-21/22 (D53, D56); test tests/test_gui_workbook.py
    issues:
      - "Automatic saves report in the status bar only; there is no view of the workbook inside the reader"
  - id: shared.live
    do: Tick Live while the macro runs (or press Update Specfile); new scans, frames and spectra are read, saved results remade
    where: left panel, beside Update Specfile
    controls: [liveCheckBox, speUpSpeFilePushButton]
    user_decides: live on or off
    automatic: partly
    could_be_automatic: turn Live on when the file is still growing (a series 'in progress')
    known_from: owner 2026-11-22 (D57); test tests/test_gui_live.py
    issues:
      - "Live stops by itself only for series with #U Series lines (L4); guessed series need a manual untick"
  - id: shared.script
    do: Read or copy the equivalent lss_core call from the Script pane; messages in the Messages pane
    where: Script and Messages panes (docks), View menu
    controls: [scriptView, messageView, menuView]
    user_decides: ""
    automatic: yes
    could_be_automatic: ""
    known_from: code; docs docs/SCRIPTING.md
    issues: []
  - id: shared.frames-look
    do: Look at the frames (colour scale, log, axes, movie)
    where: Pilatus tab
    controls: [pilLogIntCheckBox, pilMinLineEdit, pilMaxLineEdit, pilMinHorizontalSlider, pilMaxHorizontalSlider, pilCMapComboBox, pilAxesComboBox, pilAspectComboBox, pilMoviePushButton]
    user_decides: colour limits, log scale, axes (Pixels, Angles, Q)
    automatic: partly
    could_be_automatic: sticky preferences and intelligent colour scales (F70); movie with sticky zoom (F69)
    known_from: code; owner 2026-11-22 (F69, F70)
    issues:
      - "Colour limits are reset on every selection (code, imageSelectedScanChanged); see docs/gui/image_display.md"

workflows:

  # ------------------------------------------------------------------ burn tests
  - id: burn-ref
    name: Burn test on a reflectivity frame series
    priority: 1
    experiment: >
      The sample is held at one reflectivity condition (Det_Th 0, one Qz,
      one absorber setting) and exposed repeatedly; the standard burn scan
      is `ascan ih a a n t`, a motor scan that does not move (owner,
      2026-11-21), with one Pilatus frame per point (e.g. 21 frames).
      Purpose: whether the specular ROI intensity changes with time under
      the beam, i.e. whether the exposure planned for the reflectivity
      run damages the film (owner, D54). No real reflectivity burn is in
      the repository; a synthetic one (tau = 400 s) is.
    recognised_by: >
      series kind 'burn' (`series.is_burn`: ascan ih, start = end, >= 3
      points, owner 2026-11-21) with Pilatus frames; reflectivity geometry
      when Det_Th is about 0 (`burn.is_gid` false). With macros writing
      `#U Series kind=burn`, the kind is given, not guessed. Detector
      Pilatus; all frames at one Qz and one Qxy (the window checks this).
    known_from: ["owner 2026-11-21 (D54, physics_notes \"Burn tests\")", "code", "tests/test_gui_burn_trends.py", "docs/handoff_out/07-burn-trends.md"]
    steps:
      - id: burn-ref.open
        uses: shared.open
      - id: burn-ref.series
        uses: shared.series
        do: "Choose the burn series ('burn 1/?: S# n') or click the burn scan"
        user_decides: which burn scan; whether it is a reflectivity or a GID burn is not shown in the list
        known_from: "run 2026-11-22 (NX file lists 'burn 1/?: S# 14' and 'burn 1/?: S# 15'); code"
        issues:
          - "Nothing offers the burn test when a burn series is chosen (TODO: offer it automatically, F60)"
          - "The list does not say whether the burn is at reflectivity or GID geometry"
      - id: burn-ref.frames
        uses: shared.frames
        user_decides: all frames (usual); leaving frames out is possible
      - id: burn-ref.roi
        do: Set the ROI and background used for the burn (the reflectivity ROI) and the direct-beam position
        where: Reflectivity tab (ROI fields) and Pilatus tab (DB Pos, bad pixels)
        controls: [refSlitLineEdit, refBGOffLineEdit, refBGDirComboBox, pilSpecCheckBox, pilDBPosLineEdit, pilBPCiteSpinBox, pilBPCfacSpinBox]
        user_decides: ROI size (default 21,11 px), background offset (0.5 deg) and direction (H); DB position from SPEC (default) or typed
        automatic: yes
        could_be_automatic: ROI close-up of the frames with the box drawn (F71), in the burn dialog itself
        known_from: code (burnArguments reads the Reflectivity tab's fields)
        issues:
          - "The burn ROI is set on the Reflectivity tab, which the burn dialog neither shows nor mentions: a hidden dependency across tabs"
          - "No view of the ROI on the frames before the analysis (F71)"
      - id: burn-ref.dialog
        do: Open the burn test; it opens on the Trends tab, already analysed
        where: Pilatus tab > Burn Test; Burn test dialog
        controls: [pilBurnPushButton, burnTabWidget, burnTrendPlotWidget, burnResultLabel]
        user_decides: ""
        automatic: yes
        could_be_automatic: open (or offer) it when a burn series is selected (F60)
        known_from: test tests/test_gui_burn_trends.py; code (pilBurnTest)
        issues:
          - "Refused with a message when frames of several scans or several Qz are selected; comparing two burns needs two dialogs one after the other"
          - "Burn Test sits on the Pilatus tab among GID/GISAXS/cut actions"
      - id: burn-ref.options
        do: Choose the models, the time axis, the errors and the change threshold; Analyse re-runs
        where: Burn test dialog > Trends
        controls: [burnConstantCheckBox, burnLinearCheckBox, burnExponentialCheckBox, burnDoubleExponentialCheckBox, burnTimeComboBox, burnErrorsComboBox, burnThresholdSpinBox, burnAnalysePushButton]
        user_decides: models (all four by default), time clock (default, owner 2026-11-21) or exposure, errors auto (counting for reflectivity), threshold 5 %
        automatic: yes
        could_be_automatic: ""
        known_from: "owner 2026-11-21 (D54: four models by AICc, 5 %, wall time); test tests/test_gui_burn_trends.py"
        issues:
          - "Options are kept as a preference, so a changed threshold silently carries over to the next burn (code, burnOptions)"
      - id: burn-ref.judge
        do: "Read the verdict: stable (a constant fits as well as a line) or changing, the best model, the 95 % confident time to a 5 % change"
        where: Burn test dialog > Trends (summary beside the panel; details in the label's tooltip)
        controls: [burnResultLabel, burnTrendPlotWidget]
        user_decides: whether the planned exposure is acceptable (counting time, absorbers, whether to move the sample)
        automatic: partly
        could_be_automatic: state the verdict against the planned reflectivity exposure (needs the plan; F39 macro lines)
        known_from: owner 2026-11-21 ("flat line as good as a line means a good regime"; "a confident time for < 5 % change")
        decision: "Stable over the planned exposure?"
        goto: {"no: change exposure or spot": burn-ref.series}
        issues:
          - "No dose axis: burns at different absorbers cannot be put on one curve (TODO, hand-off 07)"
          - "How the verdict feeds the next measurement is not recorded (see Q-BURN-1)"
      - id: burn-ref.legacy
        do: Optionally look at the legacy REF burn plot
        where: Burn test dialog > Legacy
        controls: [pdburn.refPushButton]
        user_decides: ""
        automatic: no
        could_be_automatic: ""
        known_from: code (pilRefBurn); test tests/test_gui_burn_trends.py
        issues:
          - "The legacy tab's REF button and GID list are actions on the Legacy tab only; their use today is unknown (Q-BURN-4)"
      - id: burn-ref.save
        uses: shared.workbook
        do: The analysis is saved automatically (kind 'burn test', Data and Trends sheets); Save adds a version with a note
        controls: [burnSavePushButton]
        known_from: owner 2026-11-22 (D56); test tests/test_gui_workbook.py (burn saved when done)
      - id: burn-ref.live
        uses: shared.live
        do: With Live on, a burn scan that is still being written is re-analysed as frames arrive (the open dialog follows)
        known_from: test tests/test_gui_live.py (a growing burn scan is remade live)
    outputs: ["workbook: Saved (kind 'burn test'), Data (time, quantity +- error), Trends (one row per quantity x model)", "Messages/Script pane: exp.burn(...)"]
    scripted_as: "Experiment.burn(scan, time='clock', threshold=0.05, slit=(21, 11), bg_offset=0.5, direction='H')"
    questions: [Q-BURN-1, Q-BURN-2, Q-BURN-4, Q-BURN-5, Q-GEN-1]

  - id: burn-gid
    name: Burn test on repeated GID frames
    priority: 1
    experiment: >
      The sample is held at one GID condition (one Det_Th, one Qz level)
      and exposed repeatedly by an `ascan ih a a n t` that does not move
      (owner, 2026-11-21); one Pilatus frame per point. Public example: NX
      school scans 14 and 15, 21 frames of 10 s each, same spot and
      geometry, absorber 12 then 8 (about 4.1 x the flux). Wanted: the
      strongest Bragg peak's integrated intensity, position and width
      against time, each on its own panel with a right axis in percent
      (owner, 2026-11-21); a relative change matters, so absolute sigmas
      weigh less (owner, same day).
    recognised_by: >
      series kind 'burn' (`series.is_burn`) with Pilatus frames at Det_Th > 1
      deg (`burn.is_gid`); `#U Series kind=burn` once the macros write it.
      The private GID file lists further burn scans (23, 35, 51, ...;
      frames not on disk).
    known_from: ["owner 2026-11-21 (D54, F22a 4)", "code", "tests/test_gui_burn_trends.py", "docs/handoff_out/07-burn-trends.md", "run 2026-11-22"]
    steps:
      - id: burn-gid.open
        uses: shared.open
      - id: burn-gid.series
        uses: shared.series
        do: Choose the burn series or click the burn scan (NX 14 or 15)
        known_from: run 2026-11-22; test tests/test_gui_burn_trends.py
        issues:
          - "Nothing offers the burn test for a burn series (F60, TODO)"
      - id: burn-gid.frames
        uses: shared.frames
      - id: burn-gid.look
        uses: shared.frames-look
        do: Look at the frames to see the peak (optional)
        user_decides: whether the frames look sane (Movie, colour scale)
        known_from: guess
      - id: burn-gid.dialog
        do: Open the burn test; Trends tab, analysed; three panels (intensity, position, FWHM)
        where: Pilatus tab > Burn Test; Burn test dialog
        controls: [pilBurnPushButton, burnTabWidget, burnTrendPlotWidget, burnResultLabel]
        user_decides: ""
        automatic: yes
        could_be_automatic: offer it for a burn series (F60)
        known_from: owner 2026-11-21 (panels, % axes, summary beside); test tests/test_gui_burn_trends.py (slow, NX 15)
        issues: []
      - id: burn-gid.peak
        do: "Choose the peak: Auto peak (strongest peak of the mean frame, 3 FWHM either side, inside the lit columns) or a typed Qxy range"
        where: Burn test dialog > Trends; range field at the top of the dialog
        controls: [burnAutoPeakCheckBox, pdburn.rangeLineEdit]
        user_decides: auto (default) or another Qxy section (owner F22a 4 - override to another section)
        automatic: yes
        could_be_automatic: list the peaks found and let the user pick one by clicking
        known_from: owner 2026-11-19 (F22a 4); test tests/test_gui_burn_trends.py
        issues:
          - "The typed range field ('1.4:1.5') belongs to the legacy layout at the top of the dialog; it is used only when Auto peak is off"
          - "Detector rows are all summed; the row range is not exposed (TODO, hand-off 07)"
      - id: burn-gid.options
        do: Choose estimator, models, time, errors, threshold and whether the position counts in the limit
        where: Burn test dialog > Trends
        controls: [burnEstimatorComboBox, burnConstantCheckBox, burnLinearCheckBox, burnExponentialCheckBox, burnDoubleExponentialCheckBox, burnTimeComboBox, burnErrorsComboBox, burnThresholdSpinBox, burnPositionLimitCheckBox, burnAnalysePushButton]
        user_decides: estimator template (default), moments (legacy) or fit; errors auto = scatter for GID; position in limit off (owner - the position judgment is the user's)
        automatic: yes
        could_be_automatic: ""
        known_from: owner 2026-11-21; code; test tests/test_gui_burn_trends.py
        issues:
          - "The template estimator reads a broadening at constant area on a shoulder as an intensity gain (P44, measured on synthetic data); the user is not warned"
      - id: burn-gid.judge
        do: Read the three verdicts and the 5 % time; compare with the other burn of the same spot
        where: Burn test dialog > Trends
        controls: [burnResultLabel, burnTrendPlotWidget]
        user_decides: whether the GID exposure is acceptable; whether a position drift matters (owner - the user's judgment)
        automatic: partly
        could_be_automatic: overlay two burns of one spot against dose (TODO 'Dose axis')
        known_from: owner 2026-11-21; physics_notes 2026-11-21 (NX 14 vs 15 measured)
        decision: "Acceptable change in the GID exposure time?"
        goto: {"no: shorter exposure, more absorbers or a new spot": burn-gid.series}
        issues:
          - "Two burns (e.g. NX 14 and 15, different absorbers) cannot be shown together; the user opens the dialog twice"
      - id: burn-gid.legacy
        do: Optionally the legacy GID burn plots (constrained Qxy range)
        where: Burn test dialog > Legacy
        controls: [pdburn.gidComboBox, pdburn.rangeLineEdit]
        user_decides: ""
        automatic: no
        could_be_automatic: ""
        known_from: code (pilGidBurn); owner 2026-11-21 ("the legacy GID burn test did well once the fit range was constrained")
        issues: []
      - id: burn-gid.save
        uses: shared.workbook
        do: Saved automatically; Save adds a version with a note
        controls: [burnSavePushButton]
      - id: burn-gid.live
        uses: shared.live
        do: A growing burn scan is re-analysed as frames arrive
        known_from: test tests/test_gui_live.py
    outputs: ["workbook: Saved (burn test), Data (time; intensity, centre, FWHM +- error), Trends"]
    scripted_as: "Experiment.burn(scan, estimator='template', time='clock', qxy_range=None, limit=None)"
    questions: [Q-BURN-1, Q-BURN-2, Q-BURN-4, Q-BURN-6]

  - id: burn-fluo
    name: Burn test on repeated fluorescence spectra
    priority: 1
    experiment: >
      A fluorescence spectrum is taken repeatedly at one condition by an
      `ascan ih` that does not move, with one MCA spectrum per point;
      examples are scans 19 and 20 of the owner's private XFNTR file
      (docs/handoff_out/07, TODO area C). Wanted (by analogy with the other
      burns, not stated in these words by the owner): the element line's
      intensity per monitor against time, compared over the four models.
    recognised_by: >
      series kind 'burn' (`series.is_burn`), detector Vortex (a `#V` line)
      or per-point MCA files (`mca_save_point`). Read in the code: a scan is
      offered as MCA data only for `getandsave_mca` or a `#V` line; per-point
      files of scans without `#V` are not reachable (TODO area C).
    known_from: ["docs/handoff_out/07-burn-trends.md", "docs/TODO.md (Fluorescence burns)", "code", "guess"]
    steps:
      - id: burn-fluo.open
        uses: shared.open
      - id: burn-fluo.detector
        do: For the 7-element detector, choose the elements (XFNTR uses the central one, element 1)
        where: File > Preferences > Fluorescence detector
        controls: [actionPreferences, prefMcaCentrePushButton, prefMcaAllPushButton, prefMcaChannel1CheckBox]
        user_decides: elements summed (default all)
        automatic: no
        could_be_automatic: choose by series kind (xfntr/burn of an XFNTR sample - centre; energy - all) (D49)
        known_from: owner 2026-11-19 (D49); code
        issues:
          - "A global preference in a dialog; what a burn of fluorescence should use is not stated (Q-BURN-3)"
      - id: burn-fluo.series
        uses: shared.series
        do: Choose the burn scan
        known_from: code (is_burn does not look at the detector); guess
        issues:
          - "If the scan has no #V line its spectra are not listed at all (physics_notes 2026-11-19, checked on the October file)"
      - id: burn-fluo.spectra
        uses: shared.frames
        do: "Select all spectra; the MCA tab plots them normalised (Monc, absorber from the last #A)"
        controls: [imageListWidget, imageSelectAllCheckBox, mcaNormComboBox, mcaCalibCheckBox]
        known_from: code (mcaSelectedScanChanged)
      - id: burn-fluo.line
        do: Measure the line in each spectrum - Fit lines (sum fixes position and width, each spectrum amplitude and background) or a window Sum All
        where: MCA tab
        controls: [mcaRanLineEdit, mcaFitLinesPushButton, mcaFitOptionsPushButton, mcaSumAllPushButton, mcaXAxisComboBox]
        user_decides: the line window; fitted lines (owner D47 - lines count, not the Vortex counter) or window sum; x axis Frame
        automatic: no
        could_be_automatic: a burn dialog for MCA series (TODO - feed fit_series through trends.compare)
        known_from: code; owner 2026-11-19 (D47); guess (that users do this for burns)
        issues:
          - "The Burn Test button refuses MCA scans (it needs Pilatus frames; code, pilBurnTest)"
          - "The MCA x axis offers Frame, Qz, Energy; no time axis (TODO area E: time axis in MCA)"
      - id: burn-fluo.judge
        do: Look at intensity against frame number; no trend models, no 5 % time in the window
        where: MCA tab (integral plot, list)
        controls: [mcaDataListWidget]
        user_decides: whether the line intensity changes
        automatic: no
        could_be_automatic: the same Trends panel as the Pilatus burns
        known_from: code; guess
        issues:
          - "This workflow is not supported as a burn test today; the user judges by eye or exports"
      - id: burn-fluo.export
        do: Export the intensities (x = frame) and analyse elsewhere; saved to the workbook as a fluorescence sum or line fit
        where: MCA tab
        controls: [mcaExportIntPushButton, mcaSaveWorkbookPushButton]
        user_decides: file name
        automatic: partly
        could_be_automatic: ""
        known_from: code; guess
        issues: []
    outputs: ["<name>_flu.txt (frame, I, sigma)", "workbook: fluorescence sum / line fit (not a burn test)"]
    scripted_as: "exp.fluorescence([scan], window=...) then lss_core.trends.compare(t, I, sigma) by hand (no Experiment.burn for MCA)"
    questions: [Q-BURN-3, Q-XFNTR-1]

  # ------------------------------------------------------------------ reflectivity
  - id: reflectivity
    name: Specular reflectivity
    priority: 2
    experiment: >
      A macro runs a series of `hklscan 0 0 0 0 qz1 qz2 n t` segments in Qz,
      each at an absorber setting chosen so the ROI does not saturate,
      with alignment scans (sh/oh a2scan) before and between segments; one
      Pilatus frame per point (NX school: scans 6-9, 96 frames, alignment
      4, 5, 10). Absorbers change only when counting statistics have
      dropped by more than 100 x; overlaps are not placed across the
      critical edge (owner, 2026-11-22). The reader sums the specular ROI
      minus background per frame per Monc, patches the segments by
      fitting a factor at each overlap (joint fit default since
      2026-11-22), normalises below Qc, and writes R and R/R_F for xmodfit.
    recognised_by: >
      series kind 'reflectivity': consecutive hklscans (no `#V`) whose Qz
      ranges move up and overlap or touch (`series.infer`), alignment scans
      attached as 'align'; or `#U Series kind=reflectivity`. Detector
      Pilatus at Det_Th about 0 (beam on the recorded DBPos).
    known_from: ["owner 2026-11-14/15 (PROJECT_CONTEXT, F24)", "owner 2026-11-22 (absorbers and patching)", "code", "tests/test_gui_workflows.py", "tests/test_real_nx_school.py", "run 2026-11-22"]
    steps:
      - id: ref.open
        uses: shared.open
        do: Open the SPEC file; with Pilatus images the ROI 21x11, background offset 0.5, Qc 0.0217 and the absorber factor are preset
        known_from: code; run 2026-11-22 (21,11 and 0.0217 after opening the NX file)
      - id: ref.series
        uses: shared.series
        do: "Choose the reflectivity series ('reflectivity 4/?: S# 6-9') or click one of its scans"
        known_from: run 2026-11-22; test tests/test_gui_series.py
      - id: ref.frames
        uses: shared.frames
        do: Select all frames of the series (NX 6-9 - 96 frames)
        known_from: test tests/test_real_nx_school.py
      - id: ref.check
        do: Optionally check the ROI frame by frame - Reflectivity opens the Ref tab with the frames by Qz, the ROI image, Analyze / Accept / Analyze All
        where: Pilatus tab > Reflectivity; Reflectivity tab
