# Inventory A: the menu bar. Schema: docs/gui/README.md.
# Menus and items seen in a running window (offscreen, 2026-11-22);
# effects of Calculations items read only.
- id: menuFile
  kind: menu
  label: "File"
  where: "Menu bar"
  handler: ""
  does: "Open Spec File, Preferences..., Quit"
  workflows: [session]
  needs: ""
  shown: always
  tooltip: false
  notes: "No recent files, no 'Open output folder', no 'Export all', no workbook entry; the per-SPEC workbook is reachable only through Save buttons."
- id: actionOpen_Spec_File
  kind: action
  label: "Open Spec File"
  where: "Menu bar > File"
  handler: "openSpecFile(fname=None)"
  does: "Asks for a SPEC file, reads it, lists its scans and series, opens its log"
  workflows: [session]
  needs: ""
  shown: always
  tooltip: false
  notes: "No keyboard shortcut (no Ctrl+O). The left panel has no Open button although Update Specfile and Live sit there."
- id: actionPreferences
  kind: action
  label: "Preferences..."
  where: "Menu bar > File"
  handler: showPreferences
  does: "Opens the Preferences dialog (calibrated absorber foils, Ref Patch, fitting and saving options), kept between sessions"
  workflows: [session, reflectivity]
  needs: ""
  shown: always
  tooltip: true
  notes: "Code-built (initPreferences). The dialog itself is in inventory B. The calibrated foils it holds drive the left panel's 'cal' absorber value, two levels away."
- id: actionQuit
  kind: action
  label: "Quit"
  where: "Menu bar > File"
  handler: ""
  does: "Nothing: not connected"
  workflows: [session]
  needs: ""
  shown: always
  tooltip: true
  notes: "Connected 2026-11-23 (owner, Q-UI-A12): closes the window, Ctrl+Q; tests/test_gui_menus.py. Before: triggering it left the window open (no .connect)."
- id: menuBeamlines
  removed: "2026-11-23, owner Q14: one beamline only, nothing to choose; the beamline stays APS-15IDC"
  kind: menu
  label: "Beamlines"
  where: "Menu bar"
  handler: ""
  does: "Holds the one beamline the reader supports"
  workflows: [session]
  needs: ""
  shown: always
  tooltip: false
  notes: "A whole top-level menu for a choice that cannot change (owner, 2026-11-17: 9-ID-C not supported)."
- id: actionAPS_15IDC
  removed: "2026-11-23, owner Q14: one beamline only, nothing to choose; the beamline stays APS-15IDC"
  kind: action
  label: "APS-15IDC"
  where: "Menu bar > Beamlines"
  handler: selectAPS_15IDC
  does: "Re-selects 15-ID-C (always checked) and says so in the status bar"
  workflows: [session]
  needs: ""
  shown: always
  tooltip: false
  notes: "No effect; candidate for removal or for Help > About."
- id: actionAPS_9IDC
  removed: "2026-11-23, owner Q14: one beamline only, nothing to choose; the beamline stays APS-15IDC"
  kind: action
  label: "APS-9IDC"
  where: "Menu bar > Beamlines"
  handler: ""
  does: "Hidden; 9-ID-C is not supported"
  workflows: [session]
  needs: ""
  shown: never (setVisible(False))
  tooltip: false
  notes: "Defunct; still in the .ui."
- id: menuCalculations
  kind: menu
  label: "Calculations"
  where: "Menu bar"
  handler: ""
  does: "Beamline geometry and absorber calibrations from selected scans"
  workflows: [alignment, reflectivity]
  needs: ""
  shown: always
  tooltip: false
  notes: "All three items need scans selected and (g_l) plotted in SpecPlot first; nothing in the menu says so. Lower-case, cryptic item names."
- id: actionG_l2
  kind: action
  label: "g_l2"
  where: "Menu bar > Calculations"
  handler: calg_l2
  does: "Fits sh centres of the selected scans vs incidence angle to get the crystal-sample distance g_l2 and an offset (dialog)"
  workflows: [alignment]
  needs: "two or more sh scans at different alpha, plotted in SpecPlot (centres from its fit)"
  shown: always
  tooltip: false
  notes: "Uses the SpecPlot fit centres, so it belongs beside the SpecPlot fit result. Dialog in inventory B."
- id: actionG_l3
  kind: action
  label: "g_l3"
  where: "Menu bar > Calculations"
  handler: calg_l3
  does: "Same fit for the sample-detector distance g_l3 (dialog)"
  workflows: [alignment]
  needs: "two or more scans plotted in SpecPlot"
  shown: always
  tooltip: false
  notes: "As g_l2."
- id: actionAbs_ratio
  kind: action
  label: "abs ratio"
  where: "Menu bar > Calculations"
  handler: calabsrat
  does: "Measures the absorber transmission ratio from an absorber scan (dialog)"
  workflows: [reflectivity, alignment]
  needs: "an absorber scan selected"
  shown: always
  tooltip: false
  notes: "Result is not fed to the left panel's absorber field (read only); belongs beside it or in Preferences with the calibrated foils."
- id: menuTools
  kind: menu
  label: "Tools"
  where: "Menu bar"
  handler: "lss_toolbox.menu.install (initToolsMenu)"
  does: "Every demonstration and figure generator of the repository, by area (burn tests, reflectivity patching, GID and pinhole geometry, monitor and scans, fluorescence spectra, synthetic data sets, the window and manual, made elsewhere); each item opens its page in the Tools window"
  workflows: [general]
  needs: "a source checkout to run anything (a packaged build lists the items but cannot run them)"
  shown: always
  tooltip: true
  notes: "Code-built from lss_toolbox/catalog.py (2026-11-23), so the menu, the Tools window and docs/TOOLS.md list the same items. Submenus menuTools_<area> and actions actionTool_<item id> are generated, not inventoried one by one; their tooltips are the catalogue's one-line descriptions."
- id: actionToolsWindow
  kind: action
  label: "All tools…"
  where: "Menu bar > Tools"
  handler: "ToolsWindow.show_item(None)"
  does: "Opens the Tools window at its overview (the rendered docs/TOOLS.md); a page per item: the documented variations, the script's own options, Run into a run folder, results compared pixel by pixel with the committed products"
  workflows: [general]
  needs: ""
  shown: always
  tooltip: true
  notes: "The Tools window is a separate window (lss_toolbox.window, also `python -m lss_toolbox`); its controls are listed with their tooltips in docs/TOOLS.md (from lss_toolbox/texts.py), like the fit demonstrator's, not in this inventory."
- id: menuHelp
  kind: menu
  label: "Help"
  where: "Menu bar"
  handler: ""
  does: "Documentation, About"
  workflows: [session]
  needs: ""
  shown: always
  tooltip: false
  notes: "Placed before View in the bar (View is appended in code), against the usual order (Help last)."
- id: actionDocumentation
  kind: action
  label: "Documentation"
  where: "Menu bar > Help"
  handler: ""
  does: "Nothing: not connected"
  workflows: [session]
  needs: ""
  shown: always
  tooltip: true
  notes: "Connected 2026-11-23 (owner, Q-UI-A12): opens docs/SCRIPTING.md, or its GitHub page when the docs folder is absent (packaged build); the manual when it exists. Before: opened nothing (no .connect)."
- id: actionAbout
  kind: action
  label: "About"
  where: "Menu bar > Help"
  handler: showAbout
  does: "Modal box with version 1.1, last-update date and authors"
  workflows: [session]
  needs: ""
  shown: always
  tooltip: false
  notes: "The only deliberate modal message box."
- id: menuView
  kind: menu
  label: "View"
  where: "Menu bar"
  handler: ""
  does: "Show or hide the Messages, Script and Errors panes; the residual panels above fits (F74)"
  workflows: [session]
  needs: ""
  shown: always
  tooltip: false
  notes: "Code-built in initErrorPane, so it lands after Help. Only way to open the Errors pane (error model: legacy vs budget)."
- id: messageDock_toggleViewAction
  kind: action
  label: "Messages"
  where: "Menu bar > View"
  handler: "QDockWidget.toggleViewAction"
  does: "Shows or hides the Messages pane"
  workflows: [session]
  needs: ""
  shown: always
  tooltip: false
  notes: "No objectName (Qt's toggle action); id is the attribute path."
- id: scriptDock_toggleViewAction
  kind: action
  label: "Script"
  where: "Menu bar > View"
  handler: "QDockWidget.toggleViewAction"
  does: "Shows or hides the Script pane"
  workflows: [session]
  needs: ""
  shown: always
  tooltip: false
  notes: "D59 (owner, 2026-11-22): the Script pane is opened from here only; hidden by default."
- id: errorDock_toggleViewAction
  kind: action
  label: "Errors"
  where: "Menu bar > View"
  handler: "QDockWidget.toggleViewAction"
  does: "Shows or hides the Errors pane (error model)"
  workflows: [session]
  needs: ""
  shown: always
  tooltip: false
  notes: "The error model changes every error bar; hiding its only control in View leaves no cue of which model is in use."

- id: actionFitResiduals
  kind: action
  label: "Residuals above fits"
  where: "Menu bar > View"
  handler: setFitResiduals
  does: "Shows a small panel above each plot that shows a fit (SpecPlot scan fits, cut peak fits): the residuals (y − fit)/σ of the fitted points, and χ²/dof in the fit's legend label"
  workflows: [session]
  needs: ""
  shown: always
  tooltip: true
  notes: "Added 2026-11-24 (F74, owner 2026-11-22: hidden by default). Checkable, kept between sessions (preference fit_residuals). Not yet on the MCA line fits, burn trends, the Ref Patch join preview or the older fit dialogs."