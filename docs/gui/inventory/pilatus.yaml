# Inventory A: the Pilatus tab. Schema: docs/gui/README.md.
# Seen in a running window (offscreen, 2026-11-22; NX school S# 3
# reflectivity frames, S# 11 GID frames) unless a note says "read only".
# The tab has no group boxes: a top row (geometry, bad pixels, display),
# the image, a display row (Log Int ... Max) and one crowded action row.
- id: pilatusTab
  kind: tab
  label: "Pilatus"
  where: "Pilatus"
  handler: ""
  does: "Shows the selected Pilatus frames and launches every image reduction (reflectivity, GID, GISAXS, burn, GIOXS, cuts)"
  workflows: [reflectivity, gid, gisaxs, cuts, burn-ref, burn-gid]
  needs: "Pilatus frames selected"
  shown: always
  tooltip: false
  notes: "Comes to the front when frames are selected. The bottom action row holds 15 controls of six workflows with no grouping."
- id: pilSpecCheckBox
  kind: checkbox
  label: "DB Pos[x,y]:"
  where: "Pilatus"
  handler: update2dPlots
  does: "On: take the direct-beam pixel and distance from SPEC; off: use the typed values"
  workflows: [gid, gisaxs, cuts, reflectivity, burn-gid]
  needs: "frames selected"
  shown: always
  tooltip: false
  notes: "The checkbox text is the label of the next field; that it means 'from SPEC' is not said anywhere. Same pattern on the Apex tab."
- id: pilDBPosLineEdit
  kind: lineedit
  label: ""
  where: "Pilatus"
  handler: ""
  does: "Direct-beam pixel x,y (filled from SPEC, e.g. 47,53)"
  workflows: [gid, gisaxs, cuts, reflectivity]
  needs: "DB Pos unticked to edit"
  shown: always
  tooltip: false
  notes: "No returnPressed connection: a typed value is used at the next redraw (read only). Editable even when ticked (then overwritten)."
- id: pilSDDistLineEdit
  kind: lineedit
  label: "SD Dist(mm):"
  where: "Pilatus"
  handler: ""
  does: "Sample-detector distance in mm (from SPEC, e.g. 551.0)"
  workflows: [gid, gisaxs, cuts, reflectivity]
  needs: "DB Pos unticked to edit"
  shown: always
  tooltip: false
  notes: "Unit style '(mm)' glued to the label. Not connected (read only). The pinhole S4 distance used by GID is not shown here (GID worksheet shows it)."
- id: pilBPCiteSpinBox
  kind: spin
  label: "Bad Pix Corr. Iter."
  where: "Pilatus"
  handler: imageSelectedScanChanged
  does: "Iterations of bad-pixel correction applied when frames are read (0: off)"
  workflows: [reflectivity, gid, gisaxs, cuts, burn-ref, burn-gid]
  needs: ""
  shown: always
  tooltip: false
  notes: "Changing it re-reads all frames. The Reflectivity tab has its own 'Bad Pixel Correction fac' field (inventory B); the Apex tab another. Three spellings."
- id: pilBPCfacSpinBox
  kind: spin
  label: "Fact."
  where: "Pilatus"
  handler: imageSelectedScanChanged
  does: "Threshold factor of the bad-pixel correction"
  workflows: [reflectivity, gid, gisaxs, cuts, burn-ref, burn-gid]
  needs: "iterations > 0"
  shown: always
  tooltip: false
  notes: "'Fact.' meaning not explained; no tooltip."
- id: pilAxesComboBox
  kind: combo
  label: "Axes:"
  where: "Pilatus"
  handler: update2dPlots
  does: "Image axes in Pixels, Angles or Q"
  workflows: [gid, gisaxs, cuts, reflectivity]
  needs: "frames selected"
  shown: always
  tooltip: false
  notes: "Kept between sessions until another SPEC file is opened (F88, 2026-11-24); the zoom follows a change of Axes onto the same pixels. GISAXS switches it to Q silently (the Movie no longer does, F69). Cut directions in pixels or Q are chosen separately in pilCutDirComboBox, not linked to this."
- id: pilCMapComboBox
  kind: combo
  label: "CMap:"
  where: "Pilatus"
  handler: update2dPlots
  does: "Colour map (viridis by default; magma, inferno, cividis, jet, gray, hot, summer, winter, rainbow)"
  workflows: [reflectivity, gid, gisaxs, cuts, burn-ref, burn-gid]
  needs: ""
  shown: always
  tooltip: true
  notes: "List differs from 2D_Plot ('nipy_spectral' there, formerly 'spectral'; 'rainbow' here). Since 2026-11-23 it also colours the Reflectivity ROI images (refAnalyze), which used the removed Apex tab's map before. Since 2026-11-24 viridis is the default (owner Q-IMG-14; jet stays), with a tooltip, and the choice is kept between sessions until another SPEC file is opened (F88)."
- id: pilAspectComboBox
  kind: combo
  label: "Aspect:"
  where: "Pilatus"
  handler: update2dPlots
  does: "Image aspect auto or equal"
  workflows: [gid, gisaxs, cuts]
  needs: ""
  shown: always
  tooltip: false
  notes: "Not on 2D_Plot."
- id: pilMplWidget
  kind: plot
  label: ""
  where: "Pilatus"
  handler: ""
  does: "The selected frames (at most 6 tiles, sampled, one shared colour bar), one summed frame, GISAXS or GID map; matplotlib toolbar below with Home, Fit all and Auto scale"
  workflows: [reflectivity, gid, gisaxs, cuts, burn-ref, burn-gid]
  needs: "frames selected"
  shown: always
  tooltip: "while a saturation cue is shown"
  notes: "Since 2026-11-24 (F97): pixels above 1e5 counts/s amber, above 1.5e5 red (absorber needed), from raw counts over the point's Seconds, with a note in the frame's corner; the tooltip explains it only while a cue is shown. Measured: 11 frames selected -> 10 drawn (F#0-F#9) with no notice; frame titles, axis labels and colour bars overlap and the suptitle overprints the top row; at the default scale (min -2, max 1) the reflectivity frames are a uniform yellow. No overlay of the ROI, cut band or direct beam column, except a dashed line in Movie (read only). Phase-2 subject (image_display.md). Since 2026-11-24 (F88): redrawn in place, zoom kept across redraws, scans and sessions; nearest pixels; per-tile titles 'S# n pt k' and cursor readouts of the tile under the cursor; the house icon does Fit all."
- id: pilHomePushButton
  kind: button
  label: "Home"
  where: "Pilatus (image toolbar)"
  handler: pilHome
  does: "Back to the remembered zoom: the last box drawn with the zoom tool (the whole frame if none)"
  workflows: [reflectivity, gid, gisaxs, cuts, burn-ref, burn-gid, general]
  needs: "frames shown"
  shown: always
  tooltip: true
  notes: "F88 (owner Q9, 2026-11-23: every axis gets Home and Fit all). The zoom box sets it; a pan does not. On the GID map or GISAXS it fits every axes, as Fit all."
- id: pilFitAllPushButton
  kind: button
  label: "Fit all"
  where: "Pilatus (image toolbar)"
  handler: pilFitAll
  does: "Shows the whole frame; the remembered zoom stays for Home"
  workflows: [reflectivity, gid, gisaxs, cuts, burn-ref, burn-gid, general]
  needs: "an image shown"
  shown: always
  tooltip: true
  notes: "F88. matplotlib's own Home (house icon) does the same since 2026-11-24 (its view stack no longer matches the in-place redraws)."
- id: pilAutoScalePushButton
  kind: button
  label: "Auto scale"
  where: "Pilatus (image toolbar)"
  handler: pilAutoScale
  does: "Forgets the typed Min and Max of this kind of frame: automatic limits again"
  workflows: [reflectivity, gid, gisaxs, cuts, burn-ref, burn-gid, general]
  needs: "frames shown"
  shown: always
  tooltip: true
  notes: "F88/F70: automatic = 99.9th percentile of the selection per Monc with the direct beam masked, 1st percentile at the bottom (owner Q8, Q-IMG-4; lss_core.display.robust_limits)."
- id: pilLogIntCheckBox
  kind: checkbox
  label: "Log Int"
  where: "Pilatus"
  handler: update2dPlots
  does: "Log colour scale"
  workflows: [reflectivity, gid, gisaxs, cuts, burn-ref, burn-gid]
  needs: ""
  shown: always
  tooltip: true
  notes: "Since 2026-11-24 the default follows the kind of frame (owner Q8: log for reflectivity, GID, GISAXS; linear for direct beam and dark) and the user's choice is kept per kind until another SPEC file (F88); tooltip. Name differs from LogX/LogY elsewhere."
- id: pilPinholeCheckBox
  kind: checkbox
  label: "Pinhole"
  where: "Pilatus"
  handler: update2dPlots
  does: "Pinhole geometry (default): frames at Det_Th > 1 deg get their horizontal angle from the S4-detector distance"
  workflows: [gid, cuts, burn-gid]
  needs: ""
  shown: always
  tooltip: true
  notes: "Sits among display options (Log Int, Movie) although it is geometry. The GID worksheet has its own Pinhole box (gidPinholeCheckBox, inventory B): two controls for related choices. Movie forces it on temporarily."
- id: pilMoviePushButton
  kind: button
  label: "Movie"
  where: "Pilatus"
  handler: pilMovieShow
  does: "Plays the selected frames as a movie (also 2 frames), without blocking; the movie bar under the image controls it"
  workflows: [reflectivity, gid, burn-ref, burn-gid, general]
  needs: "2 or more frames selected"
  shown: always
  tooltip: false
  notes: "Before 2026-11-24 a blocking loop (0.5 s per frame, no stop) that set Axes to Q and left it there, and ticked Pinhole while it played; now neither (F69). 3 or more frames play as a movie without it (owner Q7)."
- id: pilViewComboBox
  kind: combo
  label: ""
  where: "Pilatus (movie bar under the image)"
  handler: pilViewChanged
  does: "How 3 or more selected frames are shown: Movie (default), Tiles: 4 or Tiles: 6, sampled first to last"
  workflows: [reflectivity, gid, burn-ref, burn-gid, general]
  needs: "3 or more frames selected"
  shown: always
  tooltip: true
  notes: "F69 (owner Q7: a movie whenever 3 or more frames are selected). Never more than 6 tiles; the title says '4 of 41 shown (sampled)'. Kept until another SPEC file."
- id: pilMovieBackPushButton
  kind: button
  label: "◀"
  where: "Pilatus (movie bar under the image)"
  handler: pilMovieStep
  does: "Pauses, then one frame back"
  workflows: [reflectivity, gid, burn-ref, burn-gid, general]
  needs: "a movie shown"
  shown: always
  tooltip: true
  notes: "F69; also the Left, Up and Back keys on the image (Q7). Greyed when no movie is shown."
- id: pilMoviePlayPushButton
  kind: button
  label: "▶"
  where: "Pilatus (movie bar under the image)"
  handler: pilMoviePlay
  does: "Plays or pauses the movie (QTimer; zoom, map and scale stay)"
  workflows: [reflectivity, gid, burn-ref, burn-gid, general]
  needs: "a movie shown"
  shown: always
  tooltip: true
  notes: "F69; also the space bar on the image (Q7). At the last frame without Loop it plays from the start."
- id: pilMovieForwardPushButton
  kind: button
  label: "▶|"
  where: "Pilatus (movie bar under the image)"
  handler: pilMovieStep
  does: "Pauses, then one frame forward"
  workflows: [reflectivity, gid, burn-ref, burn-gid, general]
  needs: "a movie shown"
  shown: always
  tooltip: true
  notes: "F69; also the Right, Down and Forward keys on the image (Q7)."
- id: pilMovieSlider
  kind: slider
  label: ""
  where: "Pilatus (movie bar under the image)"
  handler: pilMovieSliderMoved
  does: "The frame shown, in the order of the selection; the image list marks it as the current row"
  workflows: [reflectivity, gid, burn-ref, burn-gid, general]
  needs: "a movie shown"
  shown: always
  tooltip: true
  notes: "F69. The list selection itself does not change."
- id: pilMovieCounterLabel
  kind: label
  label: "1 / 41"
  where: "Pilatus (movie bar under the image)"
  handler: 
  does: "Position of the frame shown in the selection"
  workflows: [reflectivity, gid, burn-ref, burn-gid, general]
  needs: "a movie shown"
  shown: always
  tooltip: true
  notes: "F69."
- id: pilMovieSpeedComboBox
  kind: combo
  label: ""
  where: "Pilatus (movie bar under the image)"
  handler: pilMovieSettingsChanged
  does: "Frames per second: 0.5, 1, 2 (default), 5, 10"
  workflows: [reflectivity, gid, burn-ref, burn-gid, general]
  needs: ""
  shown: always
  tooltip: true
  notes: "F69. Kept between sessions. One frame update measured at 0.07 s offscreen on NX school frames (2026-11-24)."
- id: pilMovieLoopCheckBox
  kind: checkbox
  label: "Loop"
  where: "Pilatus (movie bar under the image)"
  handler: pilMovieSettingsChanged
  does: "Starts again after the last frame; off: stops on the last frame"
  workflows: [reflectivity, gid, burn-ref, burn-gid, general]
  needs: ""
  shown: always
  tooltip: true
  notes: "F69. Off by default (an assumption: the movie plays once and stops). Kept between sessions."
- id: pilMovieInfoLabel
  kind: label
  label: ""
  where: "Pilatus (movie bar under the image)"
  handler: 
  does: "The frame shown: scan, point, Qz (reflectivity) or 2θ (GID), time since the first frame, absorber, Monc"
  workflows: [reflectivity, gid, burn-ref, burn-gid, general]
  needs: "a movie shown"
  shown: always
  tooltip: true
  notes: "F69, image_display.md M3; lss_core.display.frame_text, times from lss_core.timing."
- id: pilMinHorizontalSlider
  kind: slider
  label: "Min (%):"
  where: "Pilatus"
  handler: updatePilMinSlider
  does: "Lower end of the colour scale, from the smallest to the largest value shown (evenly in log10 on a log scale)"
  workflows: [reflectivity, gid, gisaxs, cuts, burn-ref, burn-gid]
  needs: "frames selected"
  shown: always
  tooltip: false
  notes: "Acts on release only. Before 2026-11-24 it gave slider x (max - min) / 100 without adding min; now min + ..., and a value set here is kept for the kind of frame (F88)."
- id: pilMinLineEdit
  kind: lineedit
  label: ""
  where: "Pilatus"
  handler: update2dPlots
  does: "Lower end of the colour scale as a value (Enter redraws)"
  workflows: [reflectivity, gid, gisaxs, cuts, burn-ref, burn-gid]
  needs: "frames selected"
  shown: always
  tooltip: true
  notes: "Observed '-2.0' under the label 'Min (%)': the field holds an intensity (log10 when Log Int), not a percent. Same on 2D_Plot. Since 2026-11-24 filled automatically (1st percentile; of the positive pixels on a log scale, so a negative Min can no longer make the log view NaN) and kept when typed (F88)."
- id: pilMaxHorizontalSlider
  kind: slider
  label: "Max (%):"
  where: "Pilatus"
  handler: updatePilMaxSlider
  does: "Upper end of the colour scale, from the smallest to the largest value shown (evenly in log10 on a log scale)"
  workflows: [reflectivity, gid, gisaxs, cuts, burn-ref, burn-gid]
  needs: "frames selected"
  shown: always
  tooltip: false
  notes: ""
- id: pilMaxLineEdit
  kind: lineedit
  label: ""
  where: "Pilatus"
  handler: update2dPlots
  does: "Upper end of the colour scale as a value"
  workflows: [reflectivity, gid, gisaxs, cuts, burn-ref, burn-gid]
  needs: "frames selected"
  shown: always
  tooltip: true
  notes: "Observed 1.0 for S# 3 frames and 5.0 for S# 11: defaults that saturate. Since 2026-11-24 filled automatically (99.9th percentile of the selection per Monc, direct beam masked; owner Q8, Q-IMG-4); a typed value (Enter) is kept for the kind of frame until Auto scale or another SPEC file (F88)."
- id: pilMergeSameQzCheckBox
  kind: checkbox
  label: "Merge Same Qzs"
  where: "Pilatus"
  handler: ""
  does: "When Reflectivity is pressed, frames at the same Qz are grouped into one entry of the Qz list (on by default)"
  workflows: [reflectivity]
  needs: ""
  shown: always
  tooltip: false
  notes: "Read at button time only (read only). A Reflectivity-tab setting placed on the Pilatus tab, left of the button it modifies, with no visual link."
- id: pilLowQzCorCheckBox
  kind: checkbox
  label: "Low Qz Corr."
  where: "Pilatus"
  handler: ""
  does: "Applies the low-Qz slit correction in Ref Patch (as coded always on for the first frame, P18)"
  workflows: [reflectivity]
  needs: ""
  shown: always
  tooltip: false
  notes: "Read at button time (read only). Physics option with no tooltip; abbreviated."
- id: pilRefPushButton
  kind: button
  label: "Reflectivity"
  where: "Pilatus"
  handler: refPlotWin
  does: "Opens the Reflectivity tab with the selected frames' Qz list for ROI analysis"
  workflows: [reflectivity]
  needs: "Pilatus frames selected"
  shown: "enabled, but greyed out (tooltip says what is needed) when the selection is a series of another known kind (Q-UI-A10, 2026-11-23)"
  tooltip: false
  notes: "Same text as the Reflectivity tab name; reads as navigation. Apex tab has a dead copy."
- id: pilRefPatchPushButton
  kind: button
  label: "Ref Patch"
  where: "Pilatus"
  handler: pilRefPatchData
  does: "Patches the selected reflectivity scans into one curve (joint fit by default) in the Ref Patch window"
  workflows: [reflectivity]
  needs: "frames of two or more specular scans selected"
  shown: "enabled, but greyed out (tooltip says what is needed) when the selection is a series of another known kind (Q-UI-A10, 2026-11-23)"
  tooltip: false
  notes: "Main reflectivity reduction, but no tooltip and no visual weight; its settings are in File > Preferences and on the Reflectivity tab (slits, BG offset)."
- id: pilHSlitLineEdit
  kind: lineedit
  label: "HSlits(Pixels):"
  where: "Pilatus"
  handler: ""
  does: "Columns summed around the direct-beam column for GID (default 3); mirrored by the GID worksheet's Columns"
  workflows: [gid, burn-gid]
  needs: ""
  shown: always
  tooltip: false
  notes: "Name says slits, it is a column count. Placed between Ref Patch and the GID menu."
- id: gidComboBox
  kind: combo
  label: "GID"
  where: "Pilatus"
  handler: pilGID
  does: "Action menu: GID Patch, GID Patch Relax, Save GID, Form Factor, Worksheet, Save to workbook ('GID' is the heading)"
  workflows: [gid]
  needs: "frames of a GID series (ascan dth) selected"
  shown: "enabled, but greyed out (tooltip says what is needed) when the selection is a series of another known kind (Q-UI-A10, 2026-11-23)"
  tooltip: false
  notes: "A combo box used as a menu: the last action stays as its text (state looks like a mode), choosing the same item again needs 'activated'. 'Worksheet' and 'Save to workbook' added in code. Pinhole patch vs legacy patch is decided by the Pinhole box, not visible here. Item tooltips absent."
- id: gisaxsComboBox
  kind: combo
  label: "GISAXS"
  where: "Pilatus"
  handler: pilGISAXS
  does: "Action menu: Show GISAXS (one or summed frame in Q), Save GISAXS (text file)"
  workflows: [gisaxs]
  needs: "one frame, or Sum All"
  shown: always
  tooltip: false
  notes: "Observed: after 'Show GISAXS' the combo keeps showing it; no way back to plain frames except reselecting. No Save to workbook here, unlike GID."
- id: pilBurnPushButton
  kind: button
  label: "Burn Test"
  where: "Pilatus"
  handler: pilBurnTest
  does: "Opens the Burn test dialog (ROI or GID intensity vs time, trends, fits) for repeated frames at one Q"
  workflows: [burn-ref, burn-gid]
  needs: "frames of one burn scan (same Qz and Qx) selected"
  shown: "enabled, but greyed out (tooltip says what is needed) when the selection is a series of another known kind (Q-UI-A10, 2026-11-23)"
  tooltip: false
  notes: "Top-priority workflow behind an untooltipped button in the middle of the action row. Fluorescence burn tests are on the MCA tab (inventory B)."
- id: pilGioxsPushButton
  kind: button
  label: "GIOXS"
  where: "Pilatus"
  handler: gioxsDisplay
  does: "Opens the GIOXS dialog (background-subtracted 1D profiles averaged over frames and points)"
  workflows: [cuts, gisaxs]
  needs: "frames and background frames selected"
  shown: always
  tooltip: false
  notes: "Acronym not explained; no test or benchmark exists (docs/TODO.md R5). Q-UI-A6 asks if it is used."
- id: pilCutDirComboBox
  kind: combo
  label: ""
  where: "Pilatus"
  handler: updatePilCutRange
  does: "Cut direction: Q H, Q V, Pix H, Pix V; resets the range field to a default"
  workflows: [cuts, gid]
  needs: ""
  shown: always
  tooltip: true
  notes: "Range syntax is in the item text ('[Qz_min : Qz_max]'). Defaults (lss_core.cuts.default_range, 2026-11-24): 0:1, 1:2, then the rows and columns of the frames read last (0:485, 0:194 on the Pilatus 100K; were hard-coded), in the tooltip. Q cuts on GID/GISAXS maps, pixel cuts on frames."
- id: pilIntRangeLineEdit
  kind: lineedit
  label: "Int Range: min:max"
  where: "Pilatus"
  handler: updateCutData
  does: "Integration band of the cut, typed as min:max (Enter recuts)"
  workflows: [cuts, gid]
  needs: "a cut direction"
  shown: always
  tooltip: false
  notes: "Ranges typed 'a:b' here, 'a,b' in DB Pos and Slit fields, '1:1000' in MCA Range. Observed field 40 px wide, '0:485' barely fits. No way to draw the band on the image."
- id: pilLineAreaPushButton
  kind: button
  label: "Line/Area Cuts"
  where: "Pilatus"
  handler: lineAreaCut
  does: "Makes the cut of each selected frame (or of the sum/map) and switches to the Line/Area Cuts tab"
  workflows: [cuts, gid]
  needs: "frames selected"
  shown: always
  tooltip: false
  notes: "Same label as the target tab. Only image plot with a cut interface; Reflectivity ROI, 2D_Plot and GID-worksheet maps have none (F68)."
- id: gidPatchPushButton
  kind: button
  label: "GID Patch"
  where: "Pilatus > bottom, after the GID drop-down"
  handler: gidPatch
  does: "Patches the GID levels of the selected scans into a map (was the drop-down's GID Patch)"
  workflows: [gid]
  needs: "GID scans with frames"
  shown: "enabled, but greyed out (tooltip says what is needed) when the selection is a series of another known kind (Q-UI-A10, 2026-11-23)"
  tooltip: true
  notes: "Added 2026-11-23 (owner, Q-GID-1, Q-GID-5: GID Patch is the common action, worksheet beside it). The drop-down keeps GID Patch Relax, Save GID, Form Factor, Save to workbook."
- id: gidWorksheetPushButton
  kind: button
  label: "Worksheet..."
  where: "Pilatus > bottom, after GID Patch"
  handler: showGIDWorksheet
  does: "Opens the GID patching worksheet (was the drop-down's Worksheet)"
  workflows: [gid]
  needs: ""
  shown: always
  tooltip: true
  notes: "Added 2026-11-23 (owner, Q-GID-5)."
