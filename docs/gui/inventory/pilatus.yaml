# Inventory A: the Pilatus tab. Schema: docs/gui/README.md.
# Seen in a running window (offscreen, 2026-11-22; NX school S# 3
# reflectivity frames, S# 11 GID frames) unless a note says "read only".
# The tab has no group boxes: a top row (geometry, bad pixels, display),
# the image, a display row (Log Int ... Max) and one crowded action row.
- id: pilatusTab
  kind: tab
  label: "Pilatus"
  where: "Pilatus"
  handler: ""
  does: "Shows the selected Pilatus frames and launches every image reduction (reflectivity, GID, GISAXS, burn, GIOXS, cuts)"
  workflows: [reflectivity, gid, gisaxs, cuts, burn-ref, burn-gid]
  needs: "Pilatus frames selected"
  shown: always
  tooltip: false
  notes: "Comes to the front when frames are selected. The bottom action row holds 15 controls of six workflows with no grouping."
- id: pilSpecCheckBox
  kind: checkbox
  label: "DB Pos[x,y]:"
  where: "Pilatus"
  handler: update2dPlots
  does: "On: take the direct-beam pixel and distance from SPEC; off: use the typed values"
  workflows: [gid, gisaxs, cuts, reflectivity, burn-gid]
  needs: "frames selected"
  shown: always
  tooltip: false
  notes: "The checkbox text is the label of the next field; that it means 'from SPEC' is not said anywhere. Same pattern on the Apex tab."
- id: pilDBPosLineEdit
  kind: lineedit
  label: ""
  where: "Pilatus"
  handler: ""
  does: "Direct-beam pixel x,y (filled from SPEC, e.g. 47,53)"
  workflows: [gid, gisaxs, cuts, reflectivity]
  needs: "DB Pos unticked to edit"
  shown: always
  tooltip: false
  notes: "No returnPressed connection: a typed value is used at the next redraw (read only). Editable even when ticked (then overwritten)."
- id: pilSDDistLineEdit
  kind: lineedit
  label: "SD Dist(mm):"
  where: "Pilatus"
  handler: ""
  does: "Sample-detector distance in mm (from SPEC, e.g. 551.0)"
  workflows: [gid, gisaxs, cuts, reflectivity]
  needs: "DB Pos unticked to edit"
  shown: always
  tooltip: false
  notes: "Unit style '(mm)' glued to the label. Not connected (read only). The pinhole S4 distance used by GID is not shown here (GID worksheet shows it)."
- id: pilBPCiteSpinBox
  kind: spin
  label: "Bad Pix Corr. Iter."
  where: "Pilatus"
  handler: imageSelectedScanChanged
  does: "Iterations of bad-pixel correction applied when frames are read (0: off)"
  workflows: [reflectivity, gid, gisaxs, cuts, burn-ref, burn-gid]
  needs: ""
  shown: always
  tooltip: false
  notes: "Changing it re-reads all frames. The Reflectivity tab has its own 'Bad Pixel Correction fac' field (inventory B); the Apex tab another. Three spellings."
- id: pilBPCfacSpinBox
  kind: spin
  label: "Fact."
  where: "Pilatus"
  handler: imageSelectedScanChanged
  does: "Threshold factor of the bad-pixel correction"
  workflows: [reflectivity, gid, gisaxs, cuts, burn-ref, burn-gid]
  needs: "iterations > 0"
  shown: always
  tooltip: false
  notes: "'Fact.' meaning not explained; no tooltip."
- id: pilAxesComboBox
  kind: combo
  label: "Axes:"
  where: "Pilatus"
  handler: update2dPlots
  does: "Image axes in Pixels, Angles or Q"
  workflows: [gid, gisaxs, cuts, reflectivity]
  needs: "frames selected"
  shown: always
  tooltip: false
  notes: "Movie and GISAXS switch it to Q silently. Cut directions in pixels or Q are chosen separately in pilCutDirComboBox, not linked to this."
- id: pilCMapComboBox
  kind: combo
  label: "CMap:"
  where: "Pilatus"
  handler: update2dPlots
  does: "Colour map (jet, gray, hot, summer, winter, rainbow)"
  workflows: [reflectivity, gid, gisaxs, cuts, burn-ref, burn-gid]
  needs: ""
  shown: always
  tooltip: false
  notes: "List differs from 2D_Plot ('nipy_spectral' there, formerly 'spectral'; 'rainbow' here). Since 2026-11-23 it also colours the Reflectivity ROI images (refAnalyze), which used the removed Apex tab's map before. Not kept between sessions (F70)."
- id: pilAspectComboBox
  kind: combo
  label: "Aspect:"
  where: "Pilatus"
  handler: update2dPlots
  does: "Image aspect auto or equal"
  workflows: [gid, gisaxs, cuts]
  needs: ""
  shown: always
  tooltip: false
  notes: "Not on 2D_Plot."
- id: pilMplWidget
  kind: plot
  label: ""
  where: "Pilatus"
  handler: ""
  does: "Up to 10 selected frames in a grid, each with a colour bar, or one summed frame, GISAXS or GID map; matplotlib toolbar below"
  workflows: [reflectivity, gid, gisaxs, cuts, burn-ref, burn-gid]
  needs: "frames selected"
  shown: always
  tooltip: false
  notes: "Measured: 11 frames selected -> 10 drawn (F#0-F#9) with no notice; frame titles, axis labels and colour bars overlap and the suptitle overprints the top row; at the default scale (min -2, max 1) the reflectivity frames are a uniform yellow. No overlay of the ROI, cut band or direct beam column, except a dashed line in Movie (read only). Phase-2 subject (image_display.md)."
- id: pilLogIntCheckBox
  kind: checkbox
  label: "Log Int"
  where: "Pilatus"
  handler: update2dPlots
  does: "Log colour scale"
  workflows: [reflectivity, gid, gisaxs, cuts, burn-ref, burn-gid]
  needs: ""
  shown: always
  tooltip: false
  notes: "Off by default although most frames need it (observed). Name differs from LogX/LogY elsewhere."
- id: pilPinholeCheckBox
  kind: checkbox
  label: "Pinhole"
  where: "Pilatus"
  handler: update2dPlots
  does: "Pinhole geometry (default): frames at Det_Th > 1 deg get their horizontal angle from the S4-detector distance"
  workflows: [gid, cuts, burn-gid]
  needs: ""
  shown: always
  tooltip: true
  notes: "Sits among display options (Log Int, Movie) although it is geometry. The GID worksheet has its own Pinhole box (gidPinholeCheckBox, inventory B): two controls for related choices. Movie forces it on temporarily."
- id: pilMoviePushButton
  kind: button
  label: "Movie"
  where: "Pilatus"
  handler: pilMovieShow
  does: "Shows the selected frames one after another (0.5 s each) in Q axes, ending on the last"
  workflows: [burn-ref, burn-gid, gid, general]
  needs: "frames selected"
  shown: always
  tooltip: false
  notes: "Blocks the window while it plays (time.sleep in the draw loop; read only); no stop, step, speed or loop control; switches Axes to Q and leaves it there. Owner wants movie as the default view (F69)."
- id: pilMinHorizontalSlider
  kind: slider
  label: "Min (%):"
  where: "Pilatus"
  handler: updatePilMinSlider
  does: "Lower end of the colour scale as a percentage of the image range"
  workflows: [reflectivity, gid, gisaxs, cuts, burn-ref, burn-gid]
  needs: "frames selected"
  shown: always
  tooltip: false
  notes: "Acts on release only."
- id: pilMinLineEdit
  kind: lineedit
  label: ""
  where: "Pilatus"
  handler: update2dPlots
  does: "Lower end of the colour scale as a value (Enter redraws)"
  workflows: [reflectivity, gid, gisaxs, cuts, burn-ref, burn-gid]
  needs: "frames selected"
  shown: always
  tooltip: false
  notes: "Observed '-2.0' under the label 'Min (%)': the field holds an intensity (log10 when Log Int), not a percent. Same on 2D_Plot."
- id: pilMaxHorizontalSlider
  kind: slider
  label: "Max (%):"
  where: "Pilatus"
  handler: updatePilMaxSlider
  does: "Upper end of the colour scale as a percentage of the image range"
  workflows: [reflectivity, gid, gisaxs, cuts, burn-ref, burn-gid]
  needs: "frames selected"
  shown: always
  tooltip: false
  notes: ""
- id: pilMaxLineEdit
  kind: lineedit
  label: ""
  where: "Pilatus"
  handler: update2dPlots
  does: "Upper end of the colour scale as a value"
  workflows: [reflectivity, gid, gisaxs, cuts, burn-ref, burn-gid]
  needs: "frames selected"
  shown: always
  tooltip: false
  notes: "Observed 1.0 for S# 3 frames and 5.0 for S# 11: defaults that saturate."
- id: pilMergeSameQzCheckBox
  kind: checkbox
  label: "Merge Same Qzs"
  where: "Pilatus"
  handler: ""
  does: "When Reflectivity is pressed, frames at the same Qz are grouped into one entry of the Qz list (on by default)"
  workflows: [reflectivity]
  needs: ""
  shown: always
  tooltip: false
  notes: "Read at button time only (read only). A Reflectivity-tab setting placed on the Pilatus tab, left of the button it modifies, with no visual link."
- id: pilLowQzCorCheckBox
  kind: checkbox
  label: "Low Qz Corr."
  where: "Pilatus"
  handler: ""
  does: "Applies the low-Qz slit correction in Ref Patch (as coded always on for the first frame, P18)"
  workflows: [reflectivity]
  needs: ""
  shown: always
  tooltip: false
  notes: "Read at button time (read only). Physics option with no tooltip; abbreviated."
- id: pilRefPushButton
  kind: button
  label: "Reflectivity"
  where: "Pilatus"
  handler: refPlotWin
  does: "Opens the Reflectivity tab with the selected frames' Qz list for ROI analysis"
  workflows: [reflectivity]
  needs: "Pilatus frames selected"
  shown: always
  tooltip: false
  notes: "Same text as the Reflectivity tab name; reads as navigation. Apex tab has a dead copy."
- id: pilRefPatchPushButton
  kind: button
  label: "Ref Patch"
  where: "Pilatus"
  handler: pilRefPatchData
  does: "Patches the selected reflectivity scans into one curve (joint fit by default) in the Ref Patch window"
  workflows: [reflectivity]
  needs: "frames of two or more specular scans selected"
  shown: always
  tooltip: false
  notes: "Main reflectivity reduction, but no tooltip and no visual weight; its settings are in File > Preferences and on the Reflectivity tab (slits, BG offset)."
- id: pilHSlitLineEdit
  kind: lineedit
  label: "HSlits(Pixels):"
  where: "Pilatus"
  handler: ""
  does: "Columns summed around the direct-beam column for GID (default 3); mirrored by the GID worksheet's Columns"
  workflows: [gid, burn-gid]
  needs: ""
  shown: always
  tooltip: false
  notes: "Name says slits, it is a column count. Placed between Ref Patch and the GID menu."
- id: gidComboBox
  kind: combo
  label: "GID"
  where: "Pilatus"
  handler: pilGID
  does: "Action menu: GID Patch, GID Patch Relax, Save GID, Form Factor, Worksheet, Save to workbook ('GID' is the heading)"
  workflows: [gid]
  needs: "frames of a GID series (ascan dth) selected"
  shown: always
  tooltip: false
  notes: "A combo box used as a menu: the last action stays as its text (state looks like a mode), choosing the same item again needs 'activated'. 'Worksheet' and 'Save to workbook' added in code. Pinhole patch vs legacy patch is decided by the Pinhole box, not visible here. Item tooltips absent."
- id: gisaxsComboBox
  kind: combo
  label: "GISAXS"
  where: "Pilatus"
  handler: pilGISAXS
  does: "Action menu: Show GISAXS (one or summed frame in Q), Save GISAXS (text file)"
  workflows: [gisaxs]
  needs: "one frame, or Sum All"
  shown: always
  tooltip: false
  notes: "Observed: after 'Show GISAXS' the combo keeps showing it; no way back to plain frames except reselecting. No Save to workbook here, unlike GID."
- id: pilBurnPushButton
  kind: button
  label: "Burn Test"
  where: "Pilatus"
  handler: pilBurnTest
  does: "Opens the Burn test dialog (ROI or GID intensity vs time, trends, fits) for repeated frames at one Q"
  workflows: [burn-ref, burn-gid]
  needs: "frames of one burn scan (same Qz and Qx) selected"
  shown: always
  tooltip: false
  notes: "Top-priority workflow behind an untooltipped button in the middle of the action row. Fluorescence burn tests are on the MCA tab (inventory B)."
- id: pilGioxsPushButton
  kind: button
  label: "GIOXS"
  where: "Pilatus"
  handler: gioxsDisplay
  does: "Opens the GIOXS dialog (background-subtracted 1D profiles averaged over frames and points)"
  workflows: [cuts, gisaxs]
  needs: "frames and background frames selected"
  shown: always
  tooltip: false
  notes: "Acronym not explained; no test or benchmark exists (docs/TODO.md R5). Q-UI-A6 asks if it is used."
- id: pilCutDirComboBox
  kind: combo
  label: ""
  where: "Pilatus"
  handler: updatePilCutRange
  does: "Cut direction: Q H, Q V, Pix H, Pix V; resets the range field to a default"
  workflows: [cuts, gid]
  needs: ""
  shown: always
  tooltip: false
  notes: "Range syntax is in the item text ('[Qz_min : Qz_max]'). Defaults hard-coded (0:1, 1:2, 0:485, 0:194). Q cuts on GID/GISAXS maps, pixel cuts on frames."
- id: pilIntRangeLineEdit
  kind: lineedit
  label: "Int Range: min:max"
  where: "Pilatus"
  handler: updateCutData
  does: "Integration band of the cut, typed as min:max (Enter recuts)"
  workflows: [cuts, gid]
  needs: "a cut direction"
  shown: always
  tooltip: false
  notes: "Ranges typed 'a:b' here, 'a,b' in DB Pos and Slit fields, '1:1000' in MCA Range. Observed field 40 px wide, '0:485' barely fits. No way to draw the band on the image."
- id: pilLineAreaPushButton
  kind: button
  label: "Line/Area Cuts"
  where: "Pilatus"
  handler: lineAreaCut
  does: "Makes the cut of each selected frame (or of the sum/map) and switches to the Line/Area Cuts tab"
  workflows: [cuts, gid]
  needs: "frames selected"
  shown: always
  tooltip: false
  notes: "Same label as the target tab. Only image plot with a cut interface; Reflectivity ROI, 2D_Plot and GID-worksheet maps have none (F68)."
- id: gidPatchPushButton
  kind: button
  label: "GID Patch"
  where: "Pilatus > bottom, after the GID drop-down"
  handler: gidPatch
  does: "Patches the GID levels of the selected scans into a map (was the drop-down's GID Patch)"
  workflows: [gid]
  needs: "GID scans with frames"
  shown: always
  tooltip: true
  notes: "Added 2026-11-23 (owner, Q-GID-1, Q-GID-5: GID Patch is the common action, worksheet beside it). The drop-down keeps GID Patch Relax, Save GID, Form Factor, Save to workbook."
- id: gidWorksheetPushButton
  kind: button
  label: "Worksheet..."
  where: "Pilatus > bottom, after GID Patch"
  handler: showGIDWorksheet
  does: "Opens the GID patching worksheet (was the drop-down's Worksheet)"
  workflows: [gid]
  needs: ""
  shown: always
  tooltip: true
  notes: "Added 2026-11-23 (owner, Q-GID-5)."
