# Inventory: the sample timeline tab (F83 phase 1c, 2026-11-24; owner: a tab in the
# main window). Schema: docs/gui/README.md. Code-built in MainWindow.initTimelineTab
# (timelineview.py), a view of lss_core.timeline.
- id: timelineTab
  kind: tab
  label: "Timeline"
  where: "Main window tabs, last"
  handler: timelineTabShown
  does: "The sample timeline: events (set sh 0 as new sample?, re-referencing, aborts, macro loads, session restarts, gaps), sx, sample-height scans with FWHM and p, scan bars by kind, on the file's local clock"
  workflows: [session]
  needs: "a SPEC file"
  shown: always
  tooltip: true
  notes: "Read when the tab is shown and again when the file changed (Update, Live); 36 ms for the NX file. Research: docs/gui/timeline/research.md."
- id: timelineView
  kind: plot
  label: ""
  where: "Timeline"
  handler: timelineScanClicked
  does: "The lanes (QGraphicsView): wheel zooms the time axis about the cursor, drag pans, double-click fits; a click on a scan bar or an sh scan selects that scan"
  workflows: [session]
  needs: "a SPEC file"
  shown: always
  tooltip: true
  notes: "Every item has a tooltip (rule 9). The sh scans are thumbnails (points and fit, a fixed size in pixels) since 2026-11-24. Since 2026-11-24 also: a Notes lane, and a right-click menu to answer 'new sample?' or add a note (workbook Saved rows of kind 'note'). Since 2026-11-25: the Dose colouring of the sx line (F107) and the Reduced lane (phase 1d): each saved result of the workbook as a thumbnail at its scans' times (a reflectivity as log R against Qz), amber and dashed when out of date, a dashed 'not reduced' box for a series with no result; a click opens a reflectivity on the Compare tab, other kinds by selecting their scans. Since 2026-11-25 too: the Environment lane (phase 2), any column as a strip chart (timelineEnvComboBox)."
- id: timelineFitPushButton
  kind: button
  label: "Fit all"
  where: "Timeline > top"
  handler: fit_all
  does: "Shows the whole file"
  workflows: [session]
  needs: ""
  shown: always
  tooltip: true
  notes: ""
- id: timelineDoseCheckBox
  kind: checkbox
  label: "Dose"
  where: "Timeline > top, right of Fit all"
  handler: timelineDoseToggled
  does: "Colours the sx line by the dose each spot has received, as a fraction of the burn test's dose to a 5 % change (teal none, yellow half, red the burn's dose, dark red twice it)"
  workflows: [session]
  needs: "a SPEC file with sx and a burn test (otherwise the line stays grey and the tooltip says why)"
  shown: always
  tooltip: true
  notes: "Added in code (F107, owner Q-TL-7, 2026-11-25; core lss_core.timeline.dose_track). Off by default (a preference). The burns are analysed on the dose axis (a few seconds), then kept while the file is unchanged. The burn is the sample's own (between the same two 'new sample?' guesses) or else the nearest in time; each segment's tooltip says which and the fraction. Assumptions, in the tooltip and asked through questor: one beam for the file (1 mm wide unless the burn dialog's width is typed; its height from the sample-height scans), positions within half the beam's width are one spot, every scan counts in full."
- id: timelineEnvComboBox
  kind: combo
  label: "Environment: none | <column>"
  where: "Timeline > top, right of Dose"
  handler: timelineEnvChanged
  does: "The column drawn on the Environment lane over every scan that has it, at the middle of each point's count (one line per scan)"
  workflows: [session]
  needs: "a SPEC file"
  shown: always
  tooltip: true
  notes: "Added in code (F83 phase 2, F75; 2026-11-25). Every data column of the file is offered; names that look like the tensiometer, barrier or oxygen readings (timeline.ENV_WORDS) come first and are chosen by themselves, with the owner's units (Q-TL-8: mN/m, cm², %). The choice is a preference, used again when the next file has the column. NX has no environment column: Monc shows the beam over the session."
- id: timelineInfoLabel
  kind: label
  label: "20260923: 15 scans, 09:32 to 11:23, 1 set sh 0 (new sample?)"
  where: "Timeline > top"
  handler: show_timeline
  does: "What is shown: the file, the number of scans, the time range on its local clock, the set sh 0 count; its tooltip says where each lane comes from"
  workflows: [session]
  needs: ""
  shown: always
  tooltip: true
  notes: ""
