- id: statusBar
  kind: pane
  label: ""
  where: "Bottom of the window"
  handler: "statusBar.showMessage (many places)"
  does: "Short transient messages: 'Done', 'Plotting....Wait!!', 'Live: ...', 'Saved automatically to <workbook>: R0002 line cut ... v2'"
  workflows: [session]
  needs: ""
  shown: always
  tooltip: false
  notes: "Measured: the automatic-save notice appears here only (and disappears). No permanent indicators: no live-mode badge, error-model badge, monitor normalisation (/gain, /photon), absorber factor in use, output folder or workbook name."
