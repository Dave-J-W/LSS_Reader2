# ======================= Burn test (Pilatus > Burn Test) =======================
- id: pdburn
  kind: dialog
  label: "Dialog"
  where: "Dialog (Burn test)"
  handler: pilBurnTest
  does: "Burn-test window: Trends tab (four models by AICc, the 5 % change time) and Legacy tab (REF / GID plots)"
  workflows: [burn-ref, burn-gid]
  needs: "Pilatus frames of one burn scan (one Qz, one Qxy)"
  shown: "Pilatus > Burn Test"
  tooltip: false
  notes: "Observed: modeless, title 'Dialog'. Trends analysed at once on opening. Uses the Reflectivity tab's Slit, BG Offset and BG Dir and the Pilatus tab's bad-pixel and direct-beam settings, none visible here. No fluorescence burn (burn-fluo)."
- id: burnTabWidget
  kind: tab
  label: "Trends | Legacy"
  where: "Dialog (Burn test)"
