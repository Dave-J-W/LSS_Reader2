# Inventory B: every dialog and secondary window. Schema: docs/gui/README.md.
# Ids are <dialog>.<widget>. For .ui dialogs <dialog> is the .ui file's base name, because the
# objectNames inside the files collide (eleven are "Dialog"; absratioDialog.ui and g_l3Dialog.ui
# are both "g_l2Dialog"; the two pil*Dialog.ui and scanInfoDialog.ui are all "ScanInfoDialog").
# Code-built windows use their objectName (preferencesDialog, gidWorksheetDialog, cutFitDialog,
# mcaFitDialog). "where" gives the window title shown today, then the area.
# Modal = opened with exec_() (blocks the window); modeless = show().
# Observed offscreen 2026-11-22 (NX school 6-9 Ref Patch, 14 burn; synthetic MCA) unless "read only".

# ======================= Preferences (File > Preferences...) =======================
- id: preferencesDialog
  kind: dialog
  label: "Preferences"
  where: "Preferences"
  handler: showPreferences
  does: "Settings kept between sessions: absorber foils, Ref Patch method and rule, fluorescence detector elements, saving"
  workflows: [session, reflectivity, xfntr, exafs]
  needs: ""
  shown: "File > Preferences..."
  tooltip: false
  notes: "Modeless; changes apply at once (no OK/Cancel/Apply), Close only. The menu action's tooltip still says 'Absorber foils and Ref Patch settings' (two of four groups). Holds reduction choices (patch method, detector elements) that change numbers, far from the tabs that use them."
- id: prefCalibratedCheckBox
  kind: checkbox
  label: "Calibrated foils"
  where: "Preferences > Absorber foils"
  handler: setPreference
  does: "Uses the measured foil thicknesses (9.70-10.30 keV) when 'from E' is ticked"
  workflows: [reflectivity, xfntr, gid]
  needs: "'from E' ticked in the left panel"
  shown: always
  tooltip: true
  notes: "Cue in the main window: the absorber field reads 'cal'."
- id: prefFoilTable
  kind: table
  label: ""
  where: "Preferences > Absorber foils"
  handler: ""
  does: "Shows each foil's units, nominal and calibrated thickness and run-to-run spread (read-only)"
  workflows: [reflectivity, xfntr]
  needs: ""
  shown: always
  tooltip: true
  notes: ""
- id: prefFoilRangeLabel
  kind: label
  label: "9.70-10.30 keV"
  where: "Preferences > Absorber foils"
  handler: ""
  does: "Energy range where the calibration applies"
  workflows: [reflectivity, xfntr]
  needs: ""
  shown: always
  tooltip: true
  notes: ""
- id: prefPatchAutoCheckBox
  kind: checkbox
  label: "Known ratio when fit error >"
  where: "Preferences > Ref Patch"
  handler: setPreference
  does: "At a join, uses the foils' ratio instead of the fitted factor when the fit error exceeds the threshold (and checks pass)"
  workflows: [reflectivity]
  needs: "calibrated foils"
  shown: always
  tooltip: true
  notes: "The patch window's 'Known ratio' box shows and can undo the choice per join."
- id: prefPatchThresholdSpinBox
  kind: spin
